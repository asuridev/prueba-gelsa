$kind: http-request
name: "Sin fuente de pago: 400"
url: "{{orderBaseUrl}}/orders"
method: POST
headers:
  Idempotency-Key: "{{$guid}}"
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "lines": [
        {
          "productId": "{{productLibro}}",
          "quantity": 1
        }
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('400', () => pm.response.to.have.status(400));
      pm.test('code PAYMENT_SOURCE_INVALID', () => pm.expect(pm.response.json().code).to.eql('PAYMENT_SOURCE_INVALID'));
    language: text/javascript
order: 5000
