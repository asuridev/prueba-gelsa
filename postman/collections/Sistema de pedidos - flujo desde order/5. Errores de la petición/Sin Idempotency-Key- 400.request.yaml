$kind: http-request
name: "Sin Idempotency-Key: 400"
url: "{{orderBaseUrl}}/orders"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "lines": [
        {
          "productId": "{{productLibro}}",
          "quantity": 1
        }
      ],
      "paymentToken": "pm_card_visa"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('400', () => pm.response.to.have.status(400));
      pm.test('code IDEMPOTENCY_KEY_REQUIRED', () => pm.expect(pm.response.json().code).to.eql('IDEMPOTENCY_KEY_REQUIRED'));
    language: text/javascript
order: 2000
