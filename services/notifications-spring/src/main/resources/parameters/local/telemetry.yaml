# Telemetría: trazas, métricas y logs por OTLP/HTTP a un colector OpenTelemetry.
# Cambiar de backend es cambiar la configuración del COLECTOR, no este archivo.
management:
  tracing:
    propagation:
      produce: w3c
      consume: w3c, b3, b3_multi
    sampling:
      probability: 1.0
    export:
      otlp:
        enabled: ${TELEMETRY_EXPORT_ENABLED:false}
  logging:
    export:
      otlp:
        enabled: ${LOG_EXPORT_OTLP:false}
  opentelemetry:
    resource-attributes:
      "[service.version]": "0.3.0"
      "[deployment.environment]": local
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
          compression: gzip
    logging:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/logs
          compression: gzip
  otlp:
    metrics:
      export:
        url: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
        step: 30s
        histogram-flavor: base2_exponential_bucket_histogram
        enabled: false
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
        "[http.client.requests]": true
        "[keel.use-case]": true
        "[keel.mail.send]": true
        "[keel.timer.tick]": true
spring:
  rabbitmq:
    template:
      observation-enabled: true
    listener:
      simple:
        observation-enabled: true
keel:
  telemetry:
    # Instrumentación opcional: se apaga por ENTORNO, sin recompilar ni desplegar
    # otro código. Cambia al reiniciar el proceso, nunca en caliente.
    instrumentation:
      # los envíos de correo
      mail:
        enabled: true
