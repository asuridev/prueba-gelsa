# El servicio en contenedor para pruebas manuales (app + infraestructura + UIs).
# Generado por keel-spring build; se levanta con `bash deploy/up.sh`.
# NO es infra/docker-compose.yaml, que es la infraestructura de la generación.
name: notifications-spring-deploy
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: notifications
      POSTGRES_USER: notifications
      POSTGRES_PASSWORD: changeme
    ports:
      - ${DB_PORT:-5432}:5432
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U notifications -d notifications
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - keel-notifications-deploy
  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - ${RABBITMQ_PORT:-5672}:5672
      - ${RABBITMQ_UI_PORT:-15672}:15672
    healthcheck:
      test:
        - CMD-SHELL
        - rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 10s
      retries: 20
    networks:
      - keel-notifications-deploy
  keycloak:
    image: quay.io/keycloak/keycloak:26.3.1
    command:
      - start-dev
      - --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8180}
    ports:
      - ${KEYCLOAK_PORT:-8180}:8080
    healthcheck:
      test:
        - CMD-SHELL
        - "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'"
      interval: 5s
      timeout: 5s
      retries: 40
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    networks:
      - keel-notifications-deploy
  mailpit:
    image: axllent/mailpit:v1.31
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
      MP_ENABLE_CHAOS: "true"
      MP_SMTP_ALLOWED_RECIPIENTS: "@(?:[^@]*[.])?(?:i|in|inv|inva|inval|invali|[^i.@][^.@]*|i[^n.@][^.@]*|in[^v.@][^.@]*|inv[^a.@][^.@]*|inva[^l.@][^.@]*|inval[^i.@][^.@]*|invali[^d.@][^.@]*|invalid[^.@]+)\\z"
    ports:
      - ${MAILPIT_SMTP_PORT:-1025}:1025
      - ${MAILPIT_UI_PORT:-8025}:8025
    healthcheck:
      test:
        - CMD-SHELL
        - /mailpit readyz
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - keel-notifications-deploy
  alert-sink:
    image: wiremock/wiremock:3.13.1
    command:
      - --verbose
    ports:
      - ${ALERT_SINK_PORT:-8091}:8080
    networks:
      - keel-notifications-deploy
  lgtm:
    image: grafana/otel-lgtm:0.33.1
    ports:
      - ${GRAFANA_PORT:-3001}:3000
    environment:
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-http://alert-sink:8080/alerts}
      PROMETHEUS_EXTRA_ARGS: --enable-feature=exemplar-storage
    volumes:
      - ./observability/dashboards:/otel-lgtm/grafana/conf/provisioning/dashboards/custom:ro
      - ./observability/dashboards-provisioning.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/custom.yaml:ro
      - ./observability/alerting/keel-alerts.yaml:/otel-lgtm/grafana/conf/provisioning/alerting/keel-alerts.yaml:ro
    networks:
      - keel-notifications-deploy
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.161.0
    command:
      - --config=/etc/otelcol-contrib/config.yaml
    volumes:
      - ./otel/collector.yaml:/etc/otelcol-contrib/config.yaml:ro
      - ./otel/out:/var/otel-out
    ports:
      - ${OTEL_GRPC_PORT:-4317}:4317
      - ${OTEL_HTTP_PORT:-4318}:4318
    depends_on:
      - lgtm
    networks:
      - keel-notifications-deploy
  app:
    image: notifications-spring-deploy:latest
    ports:
      - ${APP_PORTS:-8080}:8080
    environment:
      PROFILE: develop
      NOTIFICATIONS_SENDING_TIMEOUT_MINUTES: ${NOTIFICATIONS_SENDING_TIMEOUT_MINUTES}
      NOTIFICATIONS_PERSONAL_DATA_RETENTION_MONTHS: ${NOTIFICATIONS_PERSONAL_DATA_RETENTION_MONTHS}
      DB_URL: jdbc:postgresql://db:5432/notifications
      DB_USERNAME: notifications
      DB_PASSWORD: changeme
      RABBITMQ_HOST: rabbitmq
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      LOG_EXPORT_OTLP: "true"
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/notifications/protocol/openid-connect/certs
      SECURITY_CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    networks:
      - keel-notifications-deploy
volumes:
  db-data:
networks:
  keel-notifications-deploy:
    driver: bridge
