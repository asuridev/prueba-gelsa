# Las alertas de notifications en formato Prometheus, como referencia portable.
# Generado por keel-spring build. Nadie monta este archivo: es para copiarlo al sistema de reglas
# que uses si no es el Grafana de deploy/.
groups:
  - name: keel-notifications
    rules:
      - alert: KeelOutboxDeadLettered
        expr: max_over_time(keel_outbox_dead_lettered[5m]) > 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Eventos del outbox rendidos: pérdida de datos"

      - alert: KeelUseCaseErrorRate
        expr: >-
          sum(rate(keel_use_case_seconds_count{keel_outcome="error"}[5m]))
          / clamp_min(sum(rate(keel_use_case_seconds_count[5m])), 0.001) > 0.05
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Más del 5 % de los casos de uso está fallando"
      - alert: KeelUseCaseLatency
        expr: >-
          histogram_quantile(0.95, sum by (le, keel_operation) (rate(keel_use_case_seconds_bucket[5m]))) > 1
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "El p95 de alguna operación pasa de un segundo"
      - alert: KeelConnectionPoolSaturated
        expr: max_over_time(hikaricp_connections_pending[5m]) > 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Hay peticiones esperando una conexión del pool (Hikari)"
      - alert: KeelHeapPressure
        expr: >-
          sum(jvm_memory_used_bytes{area="heap"})
          / clamp_min(sum(jvm_memory_max_bytes{area="heap"}), 1) > 0.9
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "El heap lleva diez minutos por encima del 90 %"
      - alert: KeelTimerLag
        expr: min_over_time(max(keel_timer_lag_seconds)[5m:1m]) > 60
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Hay temporizadores vencidos sin reclamar desde hace más de un minuto"
      - alert: KeelTimerParked
        expr: max_over_time(max(keel_timer_parked)[5m:1m]) > 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Hay plazos aparcados: agotaron sus intentos y no se van a cumplir solos"
