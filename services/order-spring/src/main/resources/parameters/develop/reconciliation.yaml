    # Cota del lote por pasada: sin ella, una tanda con 50.000 atascados son 50.000
    # llamadas al proveedor de una vez. Del generador, no del diseño.
    batch-size: ${RECONCILIATION_CANCEL_ORDER_PAYMENT_BATCH_SIZE:50}
