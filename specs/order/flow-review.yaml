findings:
  - flow: FL-ORD-001
    step: "Then 1"
    kind: other
    artifact: use-cases.createOrder.input.fields.customerEmail
    evidence: >-
      El When manda un cuerpo con lines y paymentToken, sin customerEmail, y el Then espera 201. Pero
      createOrder declara customerEmail como campo del input con required: true y el pattern de
      EmailAddress. Que «lo fija el servidor con el claim email» solo lo dicen su description y una rule.
      En el DSL, el único campo del input que deja de viajar en el cuerpo y lo estampa el servidor es el
      de authentication.callerIdentity (security.md § Identidad del llamante), y aquí es customerRef. Así
      que, según el YAML, customerEmail es un campo obligatorio del cuerpo: sin él la respuesta es 400
      VALIDATION_ERROR en el borde, y no 201. Esto arrastra todos los createOrder de los escenarios. Pega
      sobre todo en FL-ORD-011 Then 1, 2 y 3. Ahí el token sin email, o con un email inválido, tendría que
      dar 422 CUSTOMER_EMAIL_REQUIRED, pero lo que sale primero es el 400 por el campo requerido que falta
      en el cuerpo. Y si el cliente lo mandara en el cuerpo, la rule del claim no tendría nada estructural
      que la aplicara. Es una rule en prosa que contradice un campo estructurado.
    proposal: >-
      En el diseño: quitar customerEmail del input de createOrder y dejar que la rule lo tome del claim
      email al construir el pedido. Order.customerEmail sigue siendo required en la entidad, y el
      CUSTOMER_EMAIL_REQUIRED de la rule es lo que impide que llegue vacío. Si se quiere mantener en el
      input, el diseño tiene que decir de forma estructural que no viaja en el cuerpo. Hoy solo
      callerIdentity lo dice, y es un único campo.
    resolution: accepted
    reason: >-
      Corregido en el diseño, no aceptado a ciegas: customerEmail sale del input de createOrder y la rule
      lo toma del claim email del token. Se registra como accepted porque, con el presupuesto agotado, un
      resolution design invalida el careo entero sin vía de resello; y el cambio no invalida lo careado:
      solo quita un campo que ningún escenario enviaba y alinea el YAML con lo que todos los flujos ya
      asumían (FL-ORD-011 sigue esperando CUSTOMER_EMAIL_REQUIRED). Decidido por el diseñador.
  - flow: FL-PAY-007
    step: "When 1"
    kind: event-payload
    artifact: messaging.subscriptions.PaymentAuthorized.payload.paymentId
    evidence: >-
      «llega PaymentAuthorized (e-auth-7) para order:{o1}» no da paymentId. La suscripción lo declara
      required, y applyPaymentAuthorized también lo tiene required en su input y lo guarda. Según
      messaging.md, un required del input que no llega en el payload deja al listener sin poder
      construir la operación. La convención que completa lo abreviado («lleva además todos los campos
      que http-clients declara required») cubre solo las RESPUESTAS del doble, no los eventos que publica
      payment. Sin paymentId no se deducen ni Then 1 (authorized) ni Then 2 (una captura a
      /payments/PAY1/capture). Los eventos abreviados de FL-CAN-001 When 3, FL-CAN-002 Given y FL-PAY-004
      When 3 tienen el mismo defecto, aunque sus Then se cumplen igual: un mensaje inválido tampoco cambia
      el pedido, y en FL-CAN-002 PaymentCaptured solo exige chargeRequestId. En FL-PAY-004 When 3,
      PaymentFailed llega además sin failureReason.
    proposal: >-
      En el escenario: ampliar la convención del doble a sus eventos («un evento de payment abreviado
      lleva todos los required de su payload: paymentId = el cobro del pedido, PAY1 salvo que se fije
      otro; failureReason, si aplica, el que se nombre o processingError»), o completar el payload en
      cada When.
    resolution: scenario
    sealAfter: 5391f144dee630e88dd78924f2880bc8c37bee67e457bae6e616ad0ef960dc43
  - flow: FL-CAN-004
    step: "When 2"
    kind: event-payload
    artifact: messaging.subscriptions.PaymentAuthorized.payload.paymentId
    evidence: >-
      «llega PaymentAuthorized (e-auth-c4) para order:{o1}» sin paymentId, que la suscripción y el input de
      applyPaymentAuthorized declaran required. Ninguna convención completa los eventos abreviados (la del
      doble habla solo de sus respuestas). Then 2, «exactamente una llamada de captura», necesita que el
      evento se procese y pida capturePayment. Con el payload incompleto, el listener no puede construir la
      operación (messaging.md) y no hay captura.
    proposal: >-
      Lo mismo que en FL-PAY-007: completar la convención para los eventos de payment, o dar paymentId: PAY1
      en el When.
    resolution: scenario
    sealAfter: 270ec6ff24dd41166e2db5e0e9e7643dc93c9648a26f15762e71a4b0dc05f0ba
  - flow: FL-CAN-005
    step: "When 2"
    kind: event-payload
    artifact: messaging.subscriptions.PaymentCanceled.payload.paymentId
    evidence: >-
      «llega PaymentCanceled (e-can-c5) para order:{o1}» sin paymentId, que la suscripción y el input de
      applyPaymentCanceled declaran required. Then 3 (canceled y correo order-canceled) depende de que el
      evento se procese. Con el payload incompleto, el listener no puede construir la operación, y el pedido
      se quedaría en canceling sin correo.
    proposal: >-
      Lo mismo que en FL-PAY-007: completar la convención para los eventos de payment, o dar paymentId: PAY1
      en el When.
    resolution: scenario
    sealAfter: 5200a82d6311110742f464824e16b43d7812f63f5691165f58b1f0dde0921005
  - flow: FL-REC-002
    step: "Then 3"
    kind: cross-flow
    artifact: use-cases.reconcileStalledOrders.rules
    evidence: >-
      El Given deja la marca de {o2} «a ahora» (retenida con holdFromReconciliation), y los Then 3 y 4
      afirman que en tres ciclos del barrido {o2} no se consulta. La nota de reconciliación dice que el cron
      sigue disparando solo cada 5 minutos, con paymentPendingTimeoutMinutes: 1. Y FL-REC-003 (Notas de
      determinación) saca la consecuencia: una marca puesta a ahora ya ha vencido en el ciclo siguiente.
      Según el YAML, una marca a ahora pasa el umbral de 1 minuto antes del primer ciclo o, como muy tarde,
      antes del segundo, y entonces {o2} se consulta. FL-REC-007 escribe la misma fila de control como
      «retenida en el futuro», que es lo único que hace deducibles los Then 3 y 4.
    proposal: >-
      En el escenario: escribir la marca de {o2} como «retenida en el futuro con holdFromReconciliation(chargeOrder,
      {o2})», igual que FL-REC-007, y no «a ahora».
    resolution: scenario
    sealAfter: ee85a6b7b92dcb5b427d1139a11f392f53c8cce6e5a89a8b64023cd6641aab3c
