# Capa use-cases — los casos de uso del servicio.
# Aquí viven también las políticas propias del caso de uso: idempotencia, caché y schedule,
# y las transiciones del lifecycle de domain que cada operación ejecuta.

operations:
  # ── Comprador ───────────────────────────────────────────────────────────────────────────────────
  createOrder:
    description: >-
      Crea un pedido con las líneas pedidas, calcula su importe con la copia local del catálogo y pide
      su cobro a payment, respondiendo con el pedido en el estado que alcanzó.
    kind: command
    input:
      fields:
        customerRef:     { type: CustomerRef, required: true, description: Lo fija el servidor con el sub del token; no viaja en el cuerpo. }
        lines:           { type: OrderLineRequest, list: true, required: true, constraints: { minItems: 1, maxItems: 50 } }
        paymentToken:    { type: string, sensitive: true, constraints: { minLength: 1, maxLength: 255 }, description: Token de un solo uso del componente de la pasarela (comprador presente). }
        paymentMethodId: { type: uuid, description: Medio de pago guardado del comprador en payment. }
    output: { entity: Order, exclude: [chargeOrderAwaitingSince, captureOrderPaymentAwaitingSince, cancelOrderPaymentAwaitingSince, actionRequiredSince] }
    idempotency: { keySource: client-key, ttlSeconds: 86400, partitionBy: [customerRef] }
    preconditions:
      - La petición trae exactamente una fuente de pago, paymentToken o paymentMethodId.
      - Ningún productId se repite entre las líneas.
      - Todos los productos pedidos existen en la copia local del catálogo y no están retirados.
      - Todos los productos pedidos tienen la misma moneda.
    rules:
      - El customerEmail del pedido NO llega en la petición - se toma del claim email del token del comprador; un token sin ese claim, o con un valor que no es una dirección válida, responde CUSTOMER_EMAIL_REQUIRED.
      - Repetir la petición con la misma Idempotency-Key devuelve el pedido creado en su estado ACTUAL, no la respuesta original.
      - Cada línea congela sku, name y price del producto tal como están en la copia local en ese instante.
      - La moneda del pedido es la de sus productos.
      - El pedido se confirma en pendingPayment, con chargeOrderAwaitingSince al instante actual, ANTES de llamar a payment; la llamada nunca ocurre dentro de la transacción.
      - El cobro se pide con chargeRequestId "order:<id del pedido>", customerRef, totalAmount, currency y la fuente de pago recibida; el paymentToken no se guarda.
      - Con la respuesta de payment se RELEE el pedido; si ya no está en pendingPayment (un evento de payment llegó antes), no se toca y se responde con su estado actual. Si sigue en pendingPayment se guarda paymentId y se aplica el estado del cobro - authorized, capturing o captured lo pasan a authorized con captureOrderPaymentAwaitingSince al instante actual (el evento de payment termina el trabajo, y si se pierde el barrido pide la captura); actionRequired a actionRequired con customerAction y actionRequiredSince; failed a paymentFailed con su failureReason, o processingError si payment no lo informa; canceled a canceled con el correo de cancelación; pending lo deja en pendingPayment.
      - Si payment rechaza la petición con PAYMENT_METHOD_UNAVAILABLE, el pedido pasa a paymentFailed con failureReason invalidPaymentMethod; con cualquier otro 4xx de negocio o de validación, a paymentFailed con failureReason processingError. Un rechazo del cobro no es un error HTTP de esta operación - responde 201 con el pedido.
      - Si payment no contesta (timeout, error de conexión, 5xx o circuito abierto), si no se pudo obtener el token M2M, o si payment responde 401 o 403, el pedido queda en pendingPayment y la operación responde 201 igualmente; el desenlace llegará por evento o lo resolverá reconcileStalledOrders.
      - Si el pedido acaba en paymentFailed, se pide el correo de pago fallido (NotificationRequested con templateCode order-payment-failed e idempotencyKey "order:<id>:payment-failed").
      - La captura NO la pide esta operación; la pide applyPaymentAuthorized al recibir PaymentAuthorized, que payment publica también para un desenlace síncrono.
    transitions:
      - { entity: Order, from: [pendingPayment], to: authorized }
      - { entity: Order, from: [pendingPayment], to: actionRequired }
      - { entity: Order, from: [pendingPayment], to: paymentFailed }
      - { entity: Order, from: [pendingPayment], to: canceled }
    errors:
      - { code: CUSTOMER_EMAIL_REQUIRED, when: El token del comprador no trae el claim email o su valor no es una dirección válida., http: 422 }
      - { code: IDEMPOTENCY_KEY_REQUIRED, when: Falta la cabecera Idempotency-Key., http: 400 }
      - { code: IDEMPOTENCY_KEY_IN_PROGRESS, when: Otra petición del mismo comprador con la misma clave se está procesando a la vez., http: 409 }
      - { code: IDEMPOTENCY_KEY_REUSED, when: El comprador ya usó esa clave con un contenido distinto., http: 409 }
      - { code: PAYMENT_SOURCE_INVALID, when: No se indica ninguna fuente de pago o se indican las dos., http: 400 }
      - { code: DUPLICATE_ORDER_LINE, when: Dos líneas piden el mismo productId., http: 422 }
      - { code: PRODUCT_NOT_AVAILABLE, when: Algún productId no está en la copia local del catálogo o está retirado., http: 422 }
      - { code: CURRENCY_MISMATCH, when: Los productos pedidos no comparten moneda., http: 422 }
    emits: [NotificationRequested]

  getOrder:
    description: Devuelve un pedido del comprador que lo pide, con sus líneas y el estado de su cobro.
    kind: query
    input:
      fields:
        id:          { type: uuid, required: true }
        customerRef: { type: CustomerRef, required: true, description: Lo fija el servidor con el sub del token. }
    output: { entity: Order, exclude: [chargeOrderAwaitingSince, captureOrderPaymentAwaitingSince, cancelOrderPaymentAwaitingSince, actionRequiredSince] }
    errors:
      - { code: ORDER_NOT_FOUND, when: No existe un pedido con ese id del comprador que pregunta., http: 404 }

  listMyOrders:
    description: Lista los pedidos del comprador que lo pide, del más reciente al más antiguo.
    kind: query
    input:
      fields:
        customerRef: { type: CustomerRef, required: true, description: Lo fija el servidor con el sub del token. }
        status:      { type: OrderStatus, description: Filtro opcional por estado. }
    output: { entity: Order, paginated: true, sort: [createdAt:desc], sortable: [createdAt], exclude: [chargeOrderAwaitingSince, captureOrderPaymentAwaitingSince, cancelOrderPaymentAwaitingSince, actionRequiredSince] }

  cancelOrder:
    description: >-
      Anula un pedido que espera la autenticación del comprador (3DS) pidiendo a payment que anule su
      cobro; el pedido queda en canceling hasta que payment confirma el desenlace.
    kind: command
    input:
      fields:
        id:          { type: uuid, required: true }
        customerRef: { type: CustomerRef, required: true, description: Lo fija el servidor con el sub del token. }
    output: { entity: Order, exclude: [chargeOrderAwaitingSince, captureOrderPaymentAwaitingSince, cancelOrderPaymentAwaitingSince, actionRequiredSince] }
    rules:
      - Orden de evaluación - el pedido no existe, ORDER_NOT_FOUND; es de otro comprador, ORDER_NOT_OWNED; está en canceling o canceled, se devuelve tal cual sin volver a llamar a payment (idempotente por estado); no está en actionRequired, ORDER_NOT_CANCELABLE sin cambiar nada.
      - El pedido pasa a canceling, con cancelOrderPaymentAwaitingSince al instante actual, y se confirma ANTES de llamar a cancelPayment de payment.
      - Con la respuesta de payment se RELEE el pedido; si ya no está en canceling (un evento llegó antes), se responde con su estado actual sin error. Si sigue en canceling - canceled lo pasa a canceled y pide el correo de cancelación (templateCode order-canceled, idempotencyKey "order:<id>:canceled"); canceling lo deja en canceling; failed lo pasa a paymentFailed con su failureReason (processingError si no viene) y pide el correo de pago fallido; authorized, capturing o captured lo pasan a authorized con captureOrderPaymentAwaitingSince al instante actual (la captura y su evento lo terminan); actionRequired lo devuelve a actionRequired y responde ORDER_CANCEL_REJECTED.
      - Toda salida de canceling hacia canceled, paymentFailed o authorized borra customerAction; la vuelta a actionRequired la conserva.
      - Si payment responde PAYMENT_NOT_CANCELABLE (el cobro avanzó, por ejemplo el 3DS se completó a la vez), el pedido vuelve a actionRequired y la operación responde ORDER_PAYMENT_ADVANCED; el evento de payment lo llevará a su desenlace.
      - Si payment responde CANCEL_REJECTED, el pedido vuelve a actionRequired y la operación responde ORDER_CANCEL_REJECTED.
      - Si payment no contesta, responde PAYMENT_NOT_FOUND, no se pudo obtener el token M2M o responde 401 o 403, el pedido queda en canceling y la operación responde 200 con él; reconcileStalledOrders vuelve a pedir la anulación.
    transitions:
      - { entity: Order, from: [actionRequired], to: canceling }
      - { entity: Order, from: [canceling], to: canceled }
      - { entity: Order, from: [canceling], to: paymentFailed }
      - { entity: Order, from: [canceling], to: actionRequired }
      - { entity: Order, from: [canceling], to: authorized }
    errors:
      - { code: ORDER_NOT_FOUND, when: No existe un pedido con ese id., http: 404 }
      - { code: ORDER_NOT_CANCELABLE, when: El pedido no está en actionRequired (ni ya en canceling o canceled)., http: 409 }
      - { code: ORDER_PAYMENT_ADVANCED, when: Payment ya no admite anular el cobro porque avanzó (por ejemplo el 3DS se completó a la vez); el pedido vuelve a actionRequired hasta que llegue el desenlace., http: 409 }
      - { code: ORDER_NOT_OWNED, when: El pedido existe pero es de otro comprador., http: 403 }
      - { code: ORDER_CANCEL_REJECTED, when: La pasarela rechazó la anulación; el pedido sigue esperando el 3DS y se puede volver a intentar., http: 422 }
      - { code: CONCURRENT_MODIFICATION, when: Otra escritura cambió el pedido a la vez., http: 409 }
    emits: [NotificationRequested]

  # ── Desenlaces del cobro (eventos de payment) ───────────────────────────────────────────────────
  applyPaymentAuthorized:
    description: Registra que payment autorizó el cobro del pedido y pide su captura.
    kind: command
    input:
      fields:
        chargeRequestId: { type: string, required: true }
        paymentId:       { type: uuid, required: true }
    output: "void"
    rules:
      - Un chargeRequestId sin el prefijo "order:" o que no corresponde a ningún pedido no es de este servicio y se ignora sin error.
      - Desde pendingPayment, actionRequired o canceling, el pedido pasa a authorized, guarda paymentId y borra customerAction.
      - En authorized (o al acabar de pasar a él) estampa captureOrderPaymentAwaitingSince, confirma, y después pide capturePayment a payment; la captura es idempotente en payment por estado.
      - La respuesta de la captura no mueve el pedido - el desenlace llega por PaymentCaptured o PaymentCanceled. Si payment no contesta, el pedido sigue en authorized y reconcileStalledOrders reintenta la captura.
      - En paid, canceled o paymentFailed no hace nada (queda en el log).
    transitions:
      - { entity: Order, from: [pendingPayment, actionRequired, canceling], to: authorized }
    errors:
      - { code: CONCURRENT_MODIFICATION, when: Otra escritura cambió el pedido a la vez; se reintenta el mensaje., http: 409 }

  applyPaymentActionRequired:
    description: Registra que el cobro del pedido necesita que el comprador complete el 3DS.
    kind: command
    input:
      fields:
        chargeRequestId: { type: string, required: true }
        paymentId:       { type: uuid, required: true }
        customerAction:  { type: json, required: true }
    output: "void"
    rules:
      - Un chargeRequestId sin el prefijo "order:" o que no corresponde a ningún pedido se ignora sin error.
      - Desde pendingPayment el pedido pasa a actionRequired con paymentId, customerAction y actionRequiredSince; en cualquier otro estado no hace nada (queda en el log).
    transitions:
      - { entity: Order, from: [pendingPayment], to: actionRequired }
    errors:
      - { code: CONCURRENT_MODIFICATION, when: Otra escritura cambió el pedido a la vez; se reintenta el mensaje., http: 409 }

  applyPaymentCaptured:
    description: Marca el pedido como pagado cuando payment confirma la captura y avisa al comprador.
    kind: command
    input:
      fields:
        chargeRequestId: { type: string, required: true }
    output: "void"
    rules:
      - Un chargeRequestId sin el prefijo "order:" o que no corresponde a ningún pedido se ignora sin error.
      - Desde authorized el pedido pasa a paid y se pide el correo de pago confirmado (NotificationRequested con templateCode order-paid e idempotencyKey "order:<id>:paid").
      - En cualquier otro estado no hace nada (queda en el log); si el pedido seguía en pendingPayment, el barrido despacha antes applyPaymentAuthorized.
    transitions:
      - { entity: Order, from: [authorized], to: paid }
    errors:
      - { code: CONCURRENT_MODIFICATION, when: Otra escritura cambió el pedido a la vez; se reintenta el mensaje., http: 409 }
    emits: [NotificationRequested]

  applyPaymentFailed:
    description: Marca el pedido con pago fallido cuando payment informa el fallo del cobro y avisa al comprador.
    kind: command
    input:
      fields:
        chargeRequestId: { type: string, required: true }
        paymentId:       { type: uuid, required: true }
        failureReason:   { type: PaymentFailureReason, required: true }
    output: "void"
    rules:
      - Un chargeRequestId sin el prefijo "order:" o que no corresponde a ningún pedido se ignora sin error.
      - Desde pendingPayment, actionRequired o canceling el pedido pasa a paymentFailed con failureReason y paymentId, borra customerAction y se pide el correo de pago fallido (templateCode order-payment-failed, idempotencyKey "order:<id>:payment-failed").
      - En cualquier otro estado (paymentFailed, authorized, paid, canceled) no hace nada (queda en el log).
    transitions:
      - { entity: Order, from: [pendingPayment, actionRequired, canceling], to: paymentFailed }
    errors:
      - { code: CONCURRENT_MODIFICATION, when: Otra escritura cambió el pedido a la vez; se reintenta el mensaje., http: 409 }
    emits: [NotificationRequested]

  applyPaymentCanceled:
    description: Marca el pedido como cancelado cuando payment confirma que la autorización quedó anulada y avisa al comprador.
    kind: command
    input:
      fields:
        chargeRequestId: { type: string, required: true }
        paymentId:       { type: uuid, required: true }
    output: "void"
    rules:
      - Un chargeRequestId sin el prefijo "order:" o que no corresponde a ningún pedido se ignora sin error.
      - Desde pendingPayment, actionRequired, authorized o canceling el pedido pasa a canceled con paymentId, borra customerAction y se pide el correo de cancelación (templateCode order-canceled, idempotencyKey "order:<id>:canceled").
      - En cualquier otro estado (canceled, paid, paymentFailed) no hace nada (queda en el log).
    transitions:
      - { entity: Order, from: [pendingPayment, actionRequired, authorized, canceling], to: canceled }
    errors:
      - { code: CONCURRENT_MODIFICATION, when: Otra escritura cambió el pedido a la vez; se reintenta el mensaje., http: 409 }
    emits: [NotificationRequested]

  applyPaymentActionRejected:
    description: Devuelve el pedido al estado que informa payment cuando la pasarela rechaza la anulación de su cobro.
    kind: command
    input:
      fields:
        chargeRequestId: { type: string, required: true }
        action:          { type: enum, values: [capture, cancel, refund], required: true }
        status:          { type: PaymentStatus, required: true, description: Estado al que volvió el cobro en payment. }
    output: "void"
    rules:
      - Un chargeRequestId sin el prefijo "order:" o que no corresponde a ningún pedido se ignora sin error.
      - Con action cancel y el pedido en canceling, el pedido vuelve a actionRequired o a authorized según status; al volver a authorized estampa captureOrderPaymentAwaitingSince al instante actual.
      - Con action capture el pedido sigue en authorized; la captura la reintenta reconcileStalledOrders.
      - Cualquier otro caso no hace nada.
    transitions:
      - { entity: Order, from: [canceling], to: actionRequired }
      - { entity: Order, from: [canceling], to: authorized }
    errors:
      - { code: CONCURRENT_MODIFICATION, when: Otra escritura cambió el pedido a la vez; se reintenta el mensaje., http: 409 }

  reconcileStalledOrders:
    description: >-
      Rescata los pedidos que se quedaron esperando un desenlace de payment - los que nunca llegaron a
      registrarse como cobro, los autorizados cuya captura no se confirmó y los que esperan una anulación.
    kind: command
    input: "void"
    output: "void"
    schedule: { cron: "*/5 * * * *" }
    dispatches: [applyPaymentAuthorized, applyPaymentActionRequired, applyPaymentCaptured, applyPaymentFailed, applyPaymentCanceled]
    rules:
      - Cada ciclo procesa como mucho 100 pedidos, los de espera más antigua primero; lo que no cabe queda para el siguiente.
      - Si un ciclo sigue en curso cuando toca el siguiente, el siguiente no arranca. Con varias instancias, cada una reclama un lote disjunto de pedidos; un pedido que falla no corta el ciclo, se registra y queda para el siguiente.
      - Tras una parada no hay nada que recuperar aparte - el barrido trabaja sobre el estado, no sobre ciclos perdidos.
      - Un pedido en pendingPayment con chargeOrderAwaitingSince de más de paymentPendingTimeoutMinutes se consulta a payment por su chargeRequestId. Si payment no lo tiene (404), pasa a paymentFailed con failureReason notReceived y se pide el correo de pago fallido. Si lo tiene - authorized o capturing despacha applyPaymentAuthorized; captured despacha applyPaymentAuthorized y después applyPaymentCaptured; actionRequired despacha applyPaymentActionRequired; failed despacha applyPaymentFailed (processingError si no trae motivo); canceled despacha applyPaymentCanceled; pending renueva chargeOrderAwaitingSince para no volver a consultarlo hasta pasado el plazo; canceling, refunding o refunded no hacen nada y quedan en el log.
      - Un pedido en actionRequired con actionRequiredSince de más de actionRequiredTimeoutHours se consulta a payment del mismo modo y despacha la operación apply del estado del cobro; en actionRequired no hace nada. Recupera un PaymentFailed o PaymentCanceled que acabó en la deadLetter.
      - Un pedido en authorized con captureOrderPaymentAwaitingSince de más de paymentActionRetryMinutes vuelve a pedir capturePayment y renueva esa marca; una respuesta captured despacha applyPaymentCaptured y una canceled, applyPaymentCanceled.
      - Un pedido en canceling con cancelOrderPaymentAwaitingSince de más de paymentActionRetryMinutes vuelve a pedir cancelPayment y renueva esa marca; una respuesta canceled o failed despacha applyPaymentCanceled o applyPaymentFailed, y una authorized, capturing o captured despacha applyPaymentAuthorized.
      - Los despachos llevan el paymentId que devuelve payment (el id del cobro), de modo que todo pedido que payment registró lo conserva.
      - Si payment no contesta, el pedido sigue igual y se reintenta en el siguiente ciclo.
    transitions:
      - entity: Order
        from: [pendingPayment]
        to: paymentFailed
        stalledAfter: { parameter: paymentPendingTimeoutMinutes, unit: minutes }
    errors:
      - { code: CONCURRENT_MODIFICATION, when: Otra escritura cambió el pedido a la vez; se reintenta en el siguiente ciclo., http: 409 }
    emits: [NotificationRequested]

  # ── Réplica del catálogo ────────────────────────────────────────────────────────────────────────
  upsertProduct:
    description: Da de alta o actualiza un producto en la copia local del catálogo.
    kind: command
    input:
      fields:
        id:            { type: uuid, required: true }
        sku:           { type: string, required: true, constraints: { maxLength: 64 } }
        name:          { type: string, required: true, constraints: { maxLength: 200 } }
        price:         { type: Amount, required: true }
        currency:      { type: CurrencyCode, required: true }
        sourceVersion: { type: long, required: true }
    output: "void"
    rules:
      - Un evento con price menor o igual que cero no se rechaza - con sourceVersion mayor que la guardada, el producto pasa a retired true con esa versión (deja de poder pedirse) y conserva sus demás datos; sin copia previa se crea como lápida. Es mejor no vender que vender a un precio que catalog ya no sostiene.
      - Si no hay copia del producto, se crea con retired false.
      - Si la hay y sourceVersion es mayor que la guardada, se sobrescribe (también una lápida, que vuelve a estar a la venta); si es menor o igual, el evento se descarta sin error, así que una lápida no la resucita un alta antigua.
      - Dos altas simultáneas del mismo producto chocan en la unicidad del id; la segunda falla con CONCURRENT_MODIFICATION y su reintento aplica la regla de versión.
      - Los pedidos ya creados no cambian; sus líneas guardan su propio precio.
    errors:
      - { code: CONCURRENT_MODIFICATION, when: Otra escritura cambió la copia del producto a la vez; se reintenta el mensaje., http: 409 }

  removeProduct:
    description: Marca un producto como retirado en la copia local (lápida) cuando catalog lo retira.
    kind: command
    input:
      fields:
        id:            { type: uuid, required: true }
        sourceVersion: { type: long, required: true }
    output: "void"
    rules:
      - Si hay copia y sourceVersion es mayor o igual que la guardada, pasa a retired true con esa versión; si es menor, el evento se descarta sin error.
      - Si no hay copia (la retirada llegó antes que el alta), se crea una lápida con el id, retired true y esa versión, sin datos de producto.
      - La fila nunca se borra; desde ese momento createOrder rechaza el producto con PRODUCT_NOT_AVAILABLE.
    errors:
      - { code: CONCURRENT_MODIFICATION, when: Otra escritura cambió la copia del producto a la vez; se reintenta el mensaje., http: 409 }
